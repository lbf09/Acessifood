<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>AcessiFood - Painel do Dono</title>
  <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="overflow-hidden bg-light">
  <div class="container-fluid vh-100 d-flex p-0">
    <div class="bg-dark text-white p-3 style="width: 250px;">
      <h3 class="text-success fw-bold">AcessiFood</h3>
      <p class="small text-muted">Gestão Acessível de Lojas</p>
      <hr>
    </div>

    <div class="flex-grow-1 d-flex flex-column bg-light">
      <header class="bg-white border-bottom p-3 d-flex justify-content-between align-items-center shadow-sm">
        <h4 class="m-0 text-secondary">Painel de Controle</h4>
        <span class="badge bg-success p-2">Dono de Loja</span>
      </header>

      <main class="flex-grow-1 overflow-auto p-4">
        <h4 class="mb-3">Lojas Cadastradas</h4>
        <table class="table table-striped table-hover mb-5">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome da Loja</th>
              <th>Dono</th>
              <th>CNPJ</th>
              <th>Endereço</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbodyLojas"></tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4>Produtos da Loja</h4>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" id="btnExportarRelatorio">Exportar Relatório TXT</button>
            <button class="btn btn-outline-primary btn-sm" id="btnExportarBackup">Exportar JSON</button>
            <button class="btn btn-outline-success btn-sm" id="btnImportarBackup">Importar JSON</button>
          </div>
        </div>

        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Loja</th>
              <th>Produto</th>
              <th>Preço</th>
              <th>Clima</th>
              <th>Glúten</th>
              <th>Lactose</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbodyProdutos"></tbody>
        </table>
      </main>
    </div>
  </div>

  <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/frmPrincipal.js"></script>
</body>
</html>
