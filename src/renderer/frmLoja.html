<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Loja</title>
  <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
  <h4 class="mb-3 text-success">Nova Loja</h4>
  <form id="formLoja">
    <div class="mb-3">
      <label class="form-label">Nome da Loja</label>
      <input type="text" name="nome" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Nome do Dono</label>
      <input type="text" name="dono_nome" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">CNPJ</label>
      <input type="text" name="cnpj" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Endereço</label>
      <input type="text" name="endereco" class="form-control" required>
    </div>
    <div class="mb-4">
      <label class="form-label">Paleta de Cores</label>
      <select name="paleta_cores" class="form-select">
        <option value="Padrão">Padrão</option>
        <option value="Alto Contraste">Alto Contraste</option>
        <option value="Suave / Tons Pastéis">Suave / Tons Pastéis</option>
      </select>
    </div>
    <button type="submit" class="btn btn-success w-100 fw-bold">Salvar Loja</button>
  </form>
  <script src="js/frmLoja.js"></script>
</body>
</html>
